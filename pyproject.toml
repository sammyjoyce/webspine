[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docs2epub"
version = "0.1.0"
description = "Turn rendered documentation sites into polished, validated EPUBs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "cairosvg>=2.7",
  "lxml>=5.0",
  "pillow>=10.0",
  "playwright>=1.48",
]

[project.scripts]
docs2epub = "docs2epub.cli:main"

[tool.setuptools.package-data]
docs2epub = ["book.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
